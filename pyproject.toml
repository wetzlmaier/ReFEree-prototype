[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "referee-eval"
version = "0.1.0"
description = "Reference-Free and Fine-Grained Method for Evaluating Factual Consistency in Real-World Code Summarization (ACL 2026)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nltk>=3.8",
    "openai>=1.0.0",
]

[project.scripts]
referee = "referee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["referee*"]

[tool.pyright]
include = ["referee", "tests", "examples"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false


